name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No `version` input: the action reads the exact pnpm pin from the
      # packageManager field in package.json, and refuses to run if both are set.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every package's own tsc, scripts included; next build alone misses
      # files outside the web app's import graph.
      - name: Type check
        run: pnpm -r check

      - name: Lint
        run: pnpm lint

      # Live tests skip here: CI has no .env.local and no service keys.
      - name: Test
        run: pnpm --filter @deepmint/scoring test && pnpm --filter @deepmint/shared test && pnpm --filter @deepmint/ingestion test && pnpm --filter @deepmint/api test

      - name: Build web
        run: pnpm --filter @deepmint/web build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
